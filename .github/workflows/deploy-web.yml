name: deploy-web
on:
  push:
    paths: ['web.zip']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o web.zip -d site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd site && npm install --omit=dev && npx --yes netlify-cli@latest deploy --prod --dir=public --functions=netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          
